<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Blog — 3DSnapTech</title>
<meta name="description" content="Aprende sobre impresión 3D, escaneo 3D y diseño 3D con 3DSnapTech: fundamentos, materiales, tecnologías, y todo lo curioso detrás de la manufactura digital.">
<style>
  :root{
    --lima:#E1E91E; --negro:#05101C; --dorado:#FEAE12; --cafe:#AD6601; --crema:#FEE4AA; --paper:#F7F4EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Poppins', system-ui, sans-serif; background:var(--negro); color:#fff; -webkit-font-smoothing:antialiased;}
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
  .mono{font-family:'DejaVu Sans Mono', monospace;}

  header{position:sticky; top:0; z-index:50; background:rgba(5,16,28,.9); backdrop-filter:blur(6px); border-bottom:1px solid rgba(255,255,255,.08);}
  header .bar{display:flex; align-items:center; justify-content:space-between; padding:14px 24px;}
  header .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:22px;}
  header .brand img{width:52px;}
  header .brand span.d{color:var(--lima);}
  nav{display:flex; gap:26px; font-size:14px; font-weight:600;}
  nav a{opacity:.85;}
  nav a:hover{opacity:1; color:var(--lima);}
  .btn{display:inline-flex; align-items:center; gap:8px; background:var(--lima); color:var(--negro); font-weight:800; padding:11px 20px; border-radius:8px; font-size:14px;}

  .hero{padding:56px 0 24px; text-align:center;}
  .eyebrow{font-family:'DejaVu Sans Mono', monospace; font-size:12.5px; letter-spacing:2px; color:var(--lima); display:block; margin-bottom:12px;}
  h1{font-size:36px; font-weight:800;}
  .hero p{margin-top:14px; color:var(--crema); max-width:520px; margin-left:auto; margin-right:auto; font-size:15px;}

  .pillar-tabs{display:flex; justify-content:center; gap:10px; margin-top:30px; flex-wrap:wrap;}
  .pillar-tab{
    padding:10px 20px; border-radius:30px; font-weight:700; font-size:13.5px;
    border:1.5px solid rgba(255,255,255,.15); color:var(--crema); cursor:pointer; background:none;
    font-family:inherit; transition:.2s;
  }
  .pillar-tab.active{background:var(--lima); color:var(--negro); border-color:var(--lima);}
  .pillar-tab:not(.active):hover{border-color:rgba(225,233,30,.5);}

  .cat-filters{display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .cat-filter{
    padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
    background:rgba(255,255,255,.05); color:var(--crema); opacity:.75; border:none; font-family:inherit;
  }
  .cat-filter.active{background:rgba(225,233,30,.15); color:var(--lima); opacity:1;}
  .cat-filter.curioso.active{background:rgba(254,174,18,.18); color:var(--dorado);}

  .posts{padding:36px 0 90px;}
  .post-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  .post-card{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; transition:.2s;}
  .post-card:hover{border-color:var(--lima); transform:translateY(-3px);}
  .post-card .cover{aspect-ratio:16/10; overflow:hidden; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 120% at 30% 20%, rgba(225,233,30,.18), rgba(5,16,28,.9));}
  .post-card .cover img{width:100%; height:100%; object-fit:cover; transition:transform .3s ease;}
  .post-card:hover .cover img{transform:scale(1.05);}
  .post-card .info{padding:18px 20px 22px;}
  .post-card .tag{font-family:'DejaVu Sans Mono', monospace; font-size:10.5px; letter-spacing:1px; color:var(--dorado);}
  .post-card h2{font-size:16px; font-weight:700; margin-top:8px; line-height:1.35;}
  .post-card p{font-size:13px; color:var(--crema); opacity:.85; margin-top:8px; line-height:1.5;}
  .post-card .read{margin-top:12px; font-size:12.5px; font-weight:700; color:var(--lima); border-bottom:1.5px solid var(--lima); display:inline-block;}

  .post-card.curioso{border-color:rgba(254,174,18,.35); background:linear-gradient(160deg, rgba(254,174,18,.08), rgba(173,102,1,.04));}
  .post-card.curioso:hover{border-color:var(--dorado);}
  .post-card.curioso .tag{color:var(--dorado);}
  .post-card.curioso .read{color:var(--dorado); border-color:var(--dorado);}
  .post-card.curioso .badge{
    display:inline-block; background:var(--dorado); color:var(--negro); font-weight:800;
    font-size:10px; padding:3px 9px; border-radius:12px; margin-bottom:8px; letter-spacing:.5px;
  }

  .empty-pillar{text-align:center; padding:50px 20px; color:var(--crema); opacity:.7; font-size:14px; grid-column:1/-1;}

  footer{background:var(--negro); border-top:1px solid rgba(255,255,255,.08); padding:34px 0;}
  footer .bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;}
  footer .brand{display:flex; align-items:center; gap:10px; font-weight:800;}
  footer .brand img{width:26px;}
  footer .links{display:flex; gap:22px; font-size:13.5px; opacity:.8;}
  footer .fine{margin-top:22px; font-size:12px; opacity:.5; text-align:center;}

  @media (max-width:860px){
    nav{display:none;}
    .post-grid{grid-template-columns:1fr;}
    h1{font-size:26px;}
  }
</style>
</head>
<body>

<header>
  <div class="bar wrap">
    <a href="index.html" class="brand"><img src="logo-transparent.png" alt="3DSnapTech"><span><span class="d">3d</span>Snaptech</span></a>
    <nav>
      <a href="index.html#servicios">Servicios</a>
      <a href="productos.html">Productos</a>
      <a href="index.html#trabajos">Trabajos</a>
      <a href="educacion.html">Educación</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <a class="btn" href="https://wa.me/573207283295" target="_blank">WhatsApp</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="eyebrow">BLOG</span>
    <h1>Aprende sobre tecnología 3D</h1>
    <p>Impresión, escaneo y diseño 3D — desde lo básico hasta lo más curioso. Escrito por el equipo de 3DSnapTech.</p>

    <div class="pillar-tabs">
      <button class="pillar-tab active" data-pillar="impresion">🖨️ Impresión 3D</button>
      <button class="pillar-tab" data-pillar="escaneo">🔵 Escaneo 3D</button>
      <button class="pillar-tab" data-pillar="diseno">🟣 Diseño 3D</button>
    </div>
    <div class="cat-filters" id="cat-filters"></div>
  </div>
</section>

<section class="posts">
  <div class="wrap">
    <div class="post-grid" id="post-grid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="bar">
      <a href="index.html" class="brand"><img src="logo-transparent.png" alt="3DSnapTech"><span>3dSnaptech</span></a>
      <div class="links">
        <a href="https://wa.me/573207283295" target="_blank">WhatsApp</a>
        <a href="https://www.instagram.com/3dsnaptech/" target="_blank">Instagram</a>
        <a href="https://www.tiktok.com/@3dsnaptech" target="_blank">TikTok</a>
        <a href="mailto:info@ansuzstudio.com">Correo</a>
      </div>
    </div>
    <div class="fine mono">© 2026 3DSNAPTECH · COLOMBIA</div>
  </div>
</footer>

<script>
  var posts = [
    {pillar:'impresion', cat:'Materiales', href:'blog-materiales.html', img:'materiales.jpg', title:'PLA, PETG o ABS: qué material elegir para tu proyecto', desc:'Cada filamento tiene fortalezas distintas. Te explicamos cuál conviene según lo que vayas a imprimir.'},
    {pillar:'impresion', cat:'Materiales', href:'blog-sostenibilidad.html', img:'sostenibilidad.jpg', title:'Impresión 3D ecológica: materiales reciclables y su impacto', desc:'Cómo la manufactura digital puede ser, al mismo tiempo, revolucionaria y amigable con el medio ambiente.'},
    {pillar:'impresion', cat:'Postprocesado', href:'blog-postprocesado.html', img:'postprocesado.jpg', title:'Acabado superficial en impresión 3D: técnicas de post-procesado', desc:'Sanding, vapor de acetona y pintura: cómo transformar una pieza bruta en algo profesional.'},
    {pillar:'impresion', cat:'Problemas', href:'blog-errores-impresion.html', img:'errores-impresion.jpg', title:'Errores comunes en impresión 3D y cómo evitarlos', desc:'Warping, spaghetti, mala adhesión: identificar y prevenir los fallos más comunes.'},
    {pillar:'impresion', cat:'3D Curioso', curioso:true, href:'blog-cine-impresion-3d.html', img:'cine-impresion-3d.jpg', title:'10 escenas de películas y series donde aparece una impresora 3D', desc:'¿Cuáles son reales y cuáles pura ciencia ficción? Te lo contamos.'},
    {pillar:'impresion', cat:'3D Curioso', curioso:true, href:'blog-pieza-mas-grande.html', img:'pieza-mas-grande.jpg', title:'¿Cuál es la pieza 3D más grande jamás fabricada?', desc:'El récord te va a sorprender — y no es lo que imaginas.'},

    {pillar:'escaneo', cat:'Fundamentos', href:'blog-escaneo.html', img:'escaneo.jpg', title:'Qué es el escaneo 3D y para qué sirve', desc:'Digitalizar una pieza existente abre posibilidades que muchos aún no conocen. Te contamos cómo funciona.'},

    {pillar:'diseno', cat:'Fundamentos', href:'blog-que-es-diseno-3d.html', img:'diseno-3d-fundamentos.jpg', title:'¿Qué es el diseño 3D y para qué sirve?', desc:'Diseño vs. modelado, y por qué es el primer paso obligatorio cuando tu idea no existe todavía.'}
  ];

  var categoriesByPillar = {
    impresion: ['Fundamentos','Tecnologías','Materiales','Calidad','Problemas','Postprocesado','3D Curioso'],
    escaneo: ['Fundamentos','Tecnologías','Escaneo de objetos','Escaneo de personas','Procesamiento','Ingeniería inversa','3D Curioso'],
    diseno: ['Fundamentos','Software','Diseño para impresión','Modelado orgánico','Modelado técnico','Archivos 3D','3D Curioso']
  };

  var currentPillar = 'impresion';
  var currentCat = 'Todos';

  function renderFilters(){
    var el = document.getElementById('cat-filters');
    var cats = ['Todos'].concat(categoriesByPillar[currentPillar]);
    el.innerHTML = cats.map(function(c){
      var isCurioso = c === '3D Curioso';
      var active = c === currentCat ? 'active' : '';
      return '<button class="cat-filter '+(isCurioso?'curioso':'')+' '+active+'" data-cat="'+c+'">'+(isCurioso?'⭐ ':'')+c+'</button>';
    }).join('');
  }

  function renderPosts(){
    var el = document.getElementById('post-grid');
    var filtered = posts.filter(function(p){
      if(p.pillar !== currentPillar) return false;
      if(currentCat !== 'Todos' && p.cat !== currentCat) return false;
      return true;
    });
    if(filtered.length === 0){
      el.innerHTML = '<div class="empty-pillar">Todavía no hay artículos publicados aquí — ¡vuelve pronto!</div>';
      return;
    }
    el.innerHTML = filtered.map(function(p){
      return '<a class="post-card '+(p.curioso?'curioso':'')+'" href="'+p.href+'">'
        + '<div class="cover"><img src="'+p.img+'" alt="'+p.title+'"></div>'
        + '<div class="info">'
        + (p.curioso ? '<span class="badge">⭐ 3D CURIOSO</span><br>' : '')
        + '<span class="tag">'+p.cat.toUpperCase()+'</span>'
        + '<h2>'+p.title+'</h2>'
        + '<p>'+p.desc+'</p>'
        + '<span class="read">Leer artículo →</span>'
        + '</div></a>';
    }).join('');
  }

  document.querySelectorAll('.pillar-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.pillar-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentPillar = btn.dataset.pillar;
      currentCat = 'Todos';
      renderFilters();
      renderPosts();
      attachFilterEvents();
    });
  });

  function attachFilterEvents(){
    document.querySelectorAll('.cat-filter').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentCat = btn.dataset.cat;
        renderFilters();
        renderPosts();
        attachFilterEvents();
      });
    });
  }

  renderFilters();
  renderPosts();
  attachFilterEvents();
</script>

</body>
</html>
