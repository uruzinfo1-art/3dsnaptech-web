<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Blog de Impresión 3D — 3DSnapTech Bogotá</title>
<meta name="description" content="Blog de 3DSnapTech, taller de impresión 3D en Bogotá: materiales, procesos, escaneo 3D, diseño 3D y sostenibilidad.">
<style>
  :root{
    --lima:#E1E91E; --negro:#05101C; --dorado:#FEAE12; --cafe:#AD6601; --crema:#FEE4AA; --paper:#F7F4EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Poppins', system-ui, sans-serif; background:var(--negro); color:#fff; -webkit-font-smoothing:antialiased;}
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
  .mono{font-family:'DejaVu Sans Mono', monospace;}

  header{position:sticky; top:0; z-index:50; background:rgba(5,16,28,.9); backdrop-filter:blur(6px); border-bottom:1px solid rgba(255,255,255,.08);}
  header .bar{display:flex; align-items:center; justify-content:space-between; padding:14px 24px;}
  header .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;}
  header .brand img{width:34px;}
  header .brand span.d{color:var(--lima);}
  nav{display:flex; gap:28px; font-size:14px; font-weight:600;}
  nav a{opacity:.85;}
  nav a:hover{opacity:1; color:var(--lima);}
  .btn{display:inline-flex; align-items:center; gap:8px; background:var(--lima); color:var(--negro); font-weight:800; padding:11px 20px; border-radius:8px; font-size:14px;}

  .hero{padding:70px 0 40px; text-align:center;}
  .eyebrow{font-family:'DejaVu Sans Mono', monospace; font-size:12.5px; letter-spacing:2px; color:var(--lima); display:block; margin-bottom:12px;}
  h1{font-size:38px; font-weight:800;}
  .hero p{margin-top:14px; color:var(--crema); max-width:520px; margin-left:auto; margin-right:auto; font-size:15.5px;}

  .pillars{padding:20px 0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .pillar-btn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:inherit; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;}
  .pillar-btn:hover{border-color:var(--lima); color:var(--lima);}
  .pillar-btn.active{background:var(--lima); color:var(--negro);}

  .posts{padding:20px 0 90px;}
  .post-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .post-card{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; transition:border-color .2s, transform .2s;}
  .post-card:hover{border-color:var(--lima); transform:translateY(-3px);}
  .post-card .cover{aspect-ratio:16/10; overflow:hidden; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 120% at 30% 20%, rgba(225,233,30,.18), rgba(5,16,28,.9));}
  .post-card .cover img{width:100%; height:100%; object-fit:cover; transition:transform .3s ease;}
  .post-card:hover .cover img{transform:scale(1.05);}
  .post-card .cover svg{width:56px; height:56px; stroke:var(--lima); fill:none;}
  .post-card .info{padding:20px 22px 24px;}
  .post-card .tag{font-family:'DejaVu Sans Mono', monospace; font-size:11px; letter-spacing:1px; color:var(--dorado);}
  .post-card h2{font-size:17px; font-weight:700; margin-top:8px; line-height:1.35;}
  .post-card p{font-size:13.5px; color:var(--crema); opacity:.85; margin-top:8px; line-height:1.55;}
  .post-card .read{margin-top:14px; font-size:13px; font-weight:700; color:var(--lima); border-bottom:1.5px solid var(--lima); display:inline-block;}
  .post-card.hidden{display:none;}

  footer{background:var(--negro); border-top:1px solid rgba(255,255,255,.08); padding:34px 0;}
  footer .bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;}
  footer .brand{display:flex; align-items:center; gap:10px; font-weight:800;}
  footer .brand img{width:26px;}
  footer .links{display:flex; gap:22px; font-size:13.5px; opacity:.8;}
  footer .fine{margin-top:22px; font-size:12px; opacity:.5; text-align:center;}

  @media (max-width:860px){
    nav{display:none;}
    .post-grid{grid-template-columns:1fr;}
    h1{font-size:28px;}
    .pillars{gap:8px;}
    .pillar-btn{font-size:12px; padding:8px 14px;}
  }
</style>
</head>
<body>

<header>
  <div class="bar wrap">
    <a href="index.html" class="brand"><img src="logo-transparent.png" alt="3DSnapTech"><span><span class="d">3d</span>Snaptech</span></a>
    <nav>
      <a href="index.html#servicios">Servicios</a>
      <a href="index.html#trabajos">Trabajos</a>
      <a href="index.html#nosotros">Nosotros</a>
      <a href="index.html#contacto">Contacto</a>
    </nav>
    <a class="btn" href="https://wa.me/573207283295" target="_blank">WhatsApp</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="eyebrow">BLOG</span>
    <h1>Aprende sobre tecnología 3D</h1>
    <p>Materiales, procesos y todo lo que hay detrás de una buena impresión — escrito por el equipo de 3DSnapTech.</p>
  </div>
</section>

<section class="pillars">
  <div class="wrap" style="width:100%; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
    <button class="pillar-btn active" data-pillar="all">Todos</button>
    <button class="pillar-btn" data-pillar="impresion">Impresión 3D</button>
    <button class="pillar-btn" data-pillar="escaneo">Escaneo 3D</button>
    <button class="pillar-btn" data-pillar="diseno">Diseño 3D</button>
  </div>
</section>

<section class="posts">
  <div class="wrap">
    <div class="post-grid" id="postGrid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="bar">
      <a href="index.html" class="brand"><img src="logo-transparent.png" alt="3DSnapTech"><span>3dSnaptech</span></a>
      <div class="links">
        <a href="https://wa.me/573207283295" target="_blank">WhatsApp</a>
        <a href="https://www.instagram.com/3dsnaptech/" target="_blank">Instagram</a>
        <a href="https://www.tiktok.com/@3dsnaptech" target="_blank">TikTok</a>
        <a href="mailto:info@ansuzstudio.com">Correo</a>
      </div>
    </div>
    <div class="fine mono">© 2026 3DSNAPTECH · BOGOTÁ, COLOMBIA</div>
  </div>
</footer>

<script>
var categoryBysPillar = {
  impresion: ['Fundamentos', 'Tecnologías', 'Materiales', 'Calidad', 'Problemas', 'Post-procesado', '3D Curioso'],
  escaneo: ['Fundamentos', 'Tecnologías', 'Escaneo de Objetos', 'Calidad', 'Problemas', 'Software', '3D Curioso'],
  diseno: ['Fundamentos', 'Tecnologías', 'Software', 'Mejores Prácticas', 'Problemas', 'Validación', '3D Curioso']
};

var posts = [
  {pillar:'impresion', cat:'Materiales', href:'blog-materiales.html', img:'materiales.jpg', title:'PLA, PETG o ABS: qué material elegir para tu proyecto', desc:'Cada filamento tiene fortalezas distintas. Te explicamos cuál conviene según lo que vayas a imprimir.'},
  {pillar:'impresion', cat:'Post-procesado', href:'blog-postprocesado.html', img:'posprocesado.jpg', title:'Acabado superficial en impresión 3D: técnicas de post-procesado', desc:'Sanding, vapor de acetona y pintura: cómo transformar una pieza bruta en algo profesional.'},
  {pillar:'impresion', cat:'Problemas', href:'blog-errores-impresion.html', img:'errores-impresion.jpg', title:'Errores comunes en impresión 3D y cómo evitarlos', desc:'Warping, spaghetti, mala adhesión: identificar y prevenir los fallos más comunes.'},
  {pillar:'impresion', cat:'Fundamentos', href:'blog-preparar-archivo-stl.html', img:'preparar-archivo-stl.jpg', title:'Cómo preparar un archivo STL para imprimir en 3D', desc:'Validación, escala, orientación y soportes: todo lo que necesitas saber antes de llevar tu diseño a la impresora.'},
  {pillar:'impresion', cat:'Fundamentos', href:'blog-tipos-soportes-impresion.html', img:'tipos-soportes.jpg', title:'Tipos de soportes en impresión 3D: cuál elegir', desc:'Estructurales, ramificados, lineales y solubles: guía completa para elegir el soporte perfecto.'},
  {pillar:'escaneo', cat:'Fundamentos', href:'blog-escaneo.html', img:'escaneo.jpg', title:'Qué es el escaneo 3D y para qué sirve', desc:'Digitalizar una pieza existente abre posibilidades que muchos aún no conocen. Te contamos cómo funciona.'},
  {pillar:'escaneo', cat:'Tecnologías', href:'blog-escaneo-objetos-complejos.html', img:'escaneo-objetos-complejos.jpg', title:'Cómo escanear objetos complejos en 3D', desc:'Guía técnica para capturar geometría compleja: objetos reflectantes, texturas y detalles finos.'},
  {pillar:'diseno', cat:'Software', href:'blog-software-diseno-3d.html', img:'software-diseno-3d.jpg', title:'Software de diseño 3D: cuál elegir según tu proyecto', desc:'Fusion 360, FreeCAD, Blender, Tinkercad: cada herramienta es para algo diferente. Te guiamos para elegir la correcta.'},
  {pillar:'diseno', cat:'Fundamentos', href:'blog-que-es-diseno-3d.html', img:'diseno-3d-fundamentos.jpg', title:'¿Qué es el diseño 3D y para qué sirve?', desc:'Una introducción clara al diseño 3D: qué es, en qué se diferencia del modelado, y para qué se usa.'},
  {pillar:'diseno', cat:'Mejores Prácticas', href:'blog-diseno-para-impresion.html', img:'diseno-para-impresion.jpg', title:'Cómo diseñar piezas optimizadas para impresión 3D', desc:'Espesores, voladizos, tolerancias y orientación: crea modelos que se imprimen perfectamente.'},
  {pillar:'impresion', cat:'Materiales', href:'blog-sostenibilidad.html', img:'sostenibilidad.jpg', title:'Impresión 3D ecológica: materiales reciclables y su impacto', desc:'Cómo la manufactura digital puede ser, al mismo tiempo, revolucionaria y amigable con el medio ambiente.'}
];

function renderPosts(filter = 'all') {
  var grid = document.getElementById('postGrid');
  grid.innerHTML = '';

  var filtered = posts.filter(function(p) {
    return filter === 'all' || p.pillar === filter;
  });

  filtered.forEach(function(post) {
    var card = document.createElement('a');
    card.className = 'post-card';
    card.href = post.href;
    card.innerHTML = `
      <div class="cover"><img src="${post.img}" alt="${post.title}"></div>
      <div class="info">
        <span class="tag">${post.cat.toUpperCase()}</span>
        <h2>${post.title}</h2>
        <p>${post.desc}</p>
        <span class="read">Leer artículo →</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.querySelectorAll('.pillar-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.pillar-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    renderPosts(this.dataset.pillar);
  });
});

renderPosts('all');
</script>

</body>
</html>
